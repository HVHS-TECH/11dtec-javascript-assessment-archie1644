<!DOCTYPE html>
<html>

<head>
    <title>Pizza Place</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1 class="title">Pizza Place</h1>

    <form class="customerForm" onsubmit="return false;">

        <label for="nameField">Name:</label>
        <input type="text" id="nameField" name="formName" placeholder="Name">

        <label for="moneyField">Money:</label>
        <input type="text" id="moneyField" name="formName" placeholder="Money">

        <input type="submit" value="Submit" onclick="getFormInput()">

    </form>

    <hr>

    <div class="menu">

    <<div class="pizzaCard">
    <img src="images/cheese1.png" alt="Cheese Pizza 1">

    <h2>Cheese Pizza 1</h2>

    <p>$30</p>

    <button onclick="pizza()">Add to Cart</button>

</div>
<div class="pizzaCard">
    <img src="images/cheese2.png" alt="Cheese Pizza 2">

    <h2>Cheese Pizza 2</h2>

    <p>$30</p>

    <button onclick="pizza()">Add to Cart</button>
</div>

<div class="pizzaCard">
    <img src="images/cheese3.png" alt="Cheese Pizza 3">

    <h2>Cheese Pizza 3</h2>

    <p>$30</p>

    <button onclick="pizza()">Add to Cart</button>
</div>
    </div>

    <hr>

    <div class="receipt">

        <h2>Receipt</h2>

        <div id="spaceForJavaScriptOutput"></div>

    </div>

    <button class="orderButton" onclick="start()">Place Order</button>

</div>

<script src="script.js"></script>

</body>
</html>
